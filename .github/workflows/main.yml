# CI workflow with separate jobs for each test file

name: CI

on:
  push:
    branches: "**"

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build"
    steps:
      - name: "Setup node"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
      - name: "Install modules"
        run: "npm install"
      - name: "Build (npm)"
        run: "npm run build"
      - name: "Cache build"
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/dist
          key: build-${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    needs: build
    name: "Test: ${{ matrix.test }}"
    strategy:
      fail-fast: false
      matrix:
        test:
          - boundedSet
          - counterCrdt
          - counterCrdt.additional
          - lifecycle-api
          - listCrdt
          - listCrdt.additional
          - mapCrdt
          - mapCrdt.additional
          - nostr-crdt
          - nostr-data
          - nostr-event
          - nostr-relay
          - nostr-user
          - put-signing
          - relay-pool
          - sha256
          - store
          - textRandom
    steps:
      - name: "Setup node"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
      - name: "Restore build cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
          key: build-${{ github.sha }}
      - name: "Run test"
        run: npx jest __tests__/${{ matrix.test }}.ts
