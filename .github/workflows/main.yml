# CI workflow with separate jobs for each test file

name: CI

on:
  push:
    branches: "**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Build"
    steps:
      - name: "Setup node"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
      - name: "Install modules"
        run: "npm install"
      - name: "Build (npm)"
        run: "npm run build"
      - name: "Cache build"
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/dist
          key: build-${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    name: "Test: ${{ matrix.test }}"
    strategy:
      fail-fast: false
      matrix:
        test:
          - boundedSet
          - browser-interop
          - counterCrdt
          - counterCrdt.additional
          - groups
          - lifecycle-api
          - listCrdt
          - listCrdt.additional
          - mapCrdt
          - mapCrdt.additional
          - nip07-user
          - nip44
          - nostr-crdt
          - nostr-data
          - nostr-event
          - nostr-relay
          - nostr-user
          - profiles
          - put-signing
          - relay-pool
          - sha256
          - storage-event-store
          - store
          - textRandom
          - tooldb-relay
    steps:
      - name: "Setup node"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
      - name: "Restore build cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
          key: build-${{ github.sha }}
      - name: "Run test"
        run: npx jest __tests__/${{ matrix.test }}.ts

  test-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    name: "Test: redis-store"
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: "Setup node"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Checkout source code"
        uses: "actions/checkout@v4"
      - name: "Restore build cache"
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/dist
          key: build-${{ github.sha }}
      - name: "Run test"
        run: npx jest __tests__/redis-store.ts
        env:
          REDIS_URL: redis://localhost:6379
